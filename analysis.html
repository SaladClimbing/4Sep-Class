<script type="application/shiny-prerendered" data-context="server-start">
library(shiny)
library(tidyverse)

# Find all baby name text files in the data directory
files <- list.files("data", pattern = "yob.*\\.txt$", full.names = TRUE)

# Read and combine the data files into a single tibble
baby_names <- read_csv(
  files,
  id = "file",
  col_names = c("name", "sex", "n"),
  col_types = "cci",
  show_col_types = FALSE
) |>
  mutate(
    # Extract the 4-digit year from the filename
    year = as.integer(str_extract(file, "\\d{4}")),
    # Use clear labels for gender
    sex = if_else(sex == "F", "Female", "Male")
  ) |>
  select(year, sex, name, n)

# Get sorted list of unique names for the dropdown
unique_names <- sort(unique(baby_names$name))
</script>
 
<script type="application/shiny-prerendered" data-context="server">
# Populate name choices on the server side for fast loading
updateSelectizeInput(
  session,
  "name",
  choices = unique_names,
  selected = "Mary",
  server = TRUE
)

output$popularity_plot <- renderPlot({
  req(input$name)

  # Filter data for the selected name
  plot_data <- baby_names |>
    filter(name == input$name)

  # Filter by gender if Male or Female is selected
  if (input$gender != "Both") {
    plot_data <- plot_data |>
      filter(sex == input$gender)
  }

  validate(
    need(nrow(plot_data) > 0, "No records found for this combination.")
  )

  # Create the popularity plot
  ggplot(plot_data, aes(x = year, y = n, color = sex)) +
    geom_line(linewidth = 1) +
    scale_color_manual(values = c("Female" = "#E64B35", "Male" = "#4DBBD5")) +
    labs(
      title = paste("Popularity of the Name", input$name),
      subtitle = "Number of babies born per year in the US",
      x = "Year",
      y = "Number of Babies",
      color = "Gender"
    ) +
    theme_minimal()
})
</script>
 
<script type="application/shiny-prerendered" data-context="server-extras">
ojs_define <- function(..., .session = shiny::getDefaultReactiveDomain()) {
  quos <- rlang::enquos(...)
  vars <- rlang::list2(...)
  nm <- names(vars)
  if (is.null(nm)) {
    nm <- rep_len("", length(vars))
  }
  mapply(
    function(q, nm, val) {
      # Infer name, if possible
      if (nm == "") {
        tryCatch(
          {
            nm <- rlang::as_name(q)
          },
          error = function(e) {
            code <- paste(collapse = "\n", deparse(rlang::f_rhs(q)))
            stop(
              "ojs_define() could not create a name for the argument: ",
              code
            )
          }
        )
      }
      .session$output[[nm]] <- val
      outputOptions(.session$output, nm, suspendWhenHidden = FALSE)
      .session$sendCustomMessage("ojs-export", list(name = nm))
      NULL
    },
    quos,
    nm,
    vars,
    SIMPLIFY = FALSE,
    USE.NAMES = FALSE
  )
  invisible()
}
</script>

      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
</div> <!-- /content -->
